# Docker Compose configuration for SecAI CLI.
#
#   cp .env.example .env      # fill in DEEPSEEK_API_KEY
#   docker compose build
#   docker compose run --rm secai analyze-log /data/access.log
#   docker compose run --rm secai scan-url "https://example.com/.env" --no-ai
#
# Want to try it completely offline (no API key needed):
#   docker compose run --rm secai scan-url "http://10.0.0.5/x.php?file=../../etc/passwd" --no-ai
#
services:
  secai:
    build:
      context: .
      dockerfile: Dockerfile
    image: secai-cli:local
    # The key comes from the shell environment or .env (.env is git-ignored)
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    # Mount the files to analyze read-only so the tool cannot modify the source data
    volumes:
      - ./samples:/data:ro
    # Keep stdin/TTY available inside the container so interactive output (rich tables) works
    stdin_open: true
    tty: true
    # Only print the help by default; real commands override this on `run`
    command: ["--help"]
